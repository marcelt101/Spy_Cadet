# # interval: key). Only acts while Home Assistant is NOT connected. Duct air is hot (>90 F)
# # while heating and cold (<61 F) while cooling; anything near room temperature
# # means the blower is off. The gap between the on and off thresholds keeps it
# # from flapping on and off.
