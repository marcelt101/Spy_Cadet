# Runs the tests and builds the itch.io zip on every push. The web version is served by GitHub Pages straight from
# the branch (root index.html and .nojekyll), the same way as Crater Crew, so this workflow does not deploy anything.
name: Test and build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run the tests
        run: node tests/run-tests.js
      - name: Build the itch.io zip
        run: python3 tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: spy-cadet-itch
          path: dist/*.zip
